# Frozen parameters of the common inference layer (PREREG section 3.3).
# Flat key: value lines only -- parsed by controller.infer.load_frozen_config (no PyYAML).
# Any edit to controller/infer.py requires `python3 controller/freeze.py` to refresh the hash.
delta_loss: 1e-4            # minimum detectable loss shift = the F1 rate of the frozen §14 point (was 1e-3: at a 1e-4 fault the LLR drift is negative and the fault can never alarm)
p_floor: 1e-6               # floor on the baseline rate p0 so log(p1/p0) is finite
k_cusum_latency_us: 10.0    # CUSUM slack for posterior-mean latency (microseconds)
h_default: 6.5              # CUSUM threshold (nats for loss, units of k for latency); per-arm knob. 5.0 gives 3/20 false-alarm seeds at 1e-4 background
alarm_min_observations: 1   # observations an element needs before it may raise the alarm
baseline_gamma: 0.05        # EMA rate of each element's running baseline
baseline_warmup_packets: 1e5   # PACKETS the baseline owner (the pool in pooled mode) must observe before
                               # CUSUM starts = 10/delta_loss, so the baseline's own noise (~1/N = 1e-5)
                               # is an order below the shift being tested.  v1.6: was baseline_warmup_epochs
                               # = 10 UPDATE CALLS, which held a low-cadence schedule in warm-up 4x longer
                               # than a high-cadence one carrying the same packets (H8 in-band arm blind).
baseline_warmup_latency_samples: 10   # latency samples before the two-sided latency CUSUM starts
baseline_mode: pooled       # per_element | pooled — every run passes pooled (PREREG v1.5 §7); the runs are authoritative
forget_rho: 0.9             # posterior pseudo-count discount per observed epoch (~10-epoch window)
prior_beta_alpha: 1.0       # Beta(1,1) prior on loss rate (alpha = losses)
prior_beta_beta: 1.0
prior_ng_mu: 0.0            # Normal-Gamma weakly informative prior on latency (us)
prior_ng_kappa: 1e-3
prior_ng_alpha: 1e-3
prior_ng_beta: 1e-3
deaggregation: uniform_prior_fractional   # path counts split evenly over links, no rounding
