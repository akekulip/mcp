# Frozen parameters of the common inference layer (PREREG section 3.3).
# Flat key: value lines only -- parsed by controller.infer.load_frozen_config (no PyYAML).
# Any edit to controller/infer.py requires `python3 controller/freeze.py` to refresh the hash.
k_cusum_loss: 2.5e-4         # CUSUM slack for posterior-mean loss rate (fraction)
k_cusum_latency_us: 10.0    # CUSUM slack for posterior-mean latency (microseconds)
h_default: 4.0              # CUSUM threshold (dimensionless, in units of k); per-arm knob
alarm_min_observations: 1   # observations an element needs before it may raise the alarm
baseline_gamma: 0.05        # EMA rate of each element's running baseline
baseline_warmup_epochs: 10  # observed epochs (per element, or of the pool in pooled mode) before CUSUM starts
baseline_mode: per_element  # per_element | pooled (fabric-wide pooled posterior-mean baseline)
forget_rho: 0.9             # posterior pseudo-count discount per observed epoch (~10-epoch window)
prior_beta_alpha: 1.0       # Beta(1,1) prior on loss rate (alpha = losses)
prior_beta_beta: 1.0
prior_ng_mu: 0.0            # Normal-Gamma weakly informative prior on latency (us)
prior_ng_kappa: 1e-3
prior_ng_alpha: 1e-3
prior_ng_beta: 1e-3
deaggregation: uniform_prior_fractional   # path counts split evenly over links, no rounding
